name: Desplegar en GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Lo llama "Añadir pregunta custom" después de subir la pregunta
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Última versión de la rama (incluye la pregunta recién subida si lo llama
      # "Añadir pregunta custom")
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      # GitHub Pages no sabe de rutas de React Router: si alguien recarga en
      # /pasapalabra/juego, servirá 404.html, que es la misma app.
      - name: Copiar index.html como 404.html
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
