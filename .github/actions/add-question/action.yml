name: Añadir pregunta custom
description: Valida una pregunta y la añade a customGameData.json en la lista de su jugador y letra.

inputs:
  para:
    description: 'Jugador: Topo o Bego'
    required: false
  tipo:
    description: 'starts ("Empieza por") o contains ("Contiene la")'
    required: false
  letra:
    description: 'Una de las 27 letras del rosco'
    required: false
  pregunta:
    description: 'Texto de la pregunta'
    required: false
  respuesta:
    description: 'Respuesta, sin espacios'
    required: false
  sustituir:
    description: >-
      Si es "true" y esa letra de ese jugador solo tiene una pregunta en el banco custom
      que es una copia exacta de la del banco por defecto, se borra y queda solo la nueva.
    required: false
    default: 'false'
  json:
    description: >-
      Opcional. Pregunta en JSON: {"to": "Bego", "letter": "X", "question": {"type": "contains",
      "question": "...", "answer": "..."}}. Si se indica, se ignoran para, tipo, letra, pregunta y respuesta.
    required: false
    default: ''
  archivo:
    description: 'Ruta del JSON de preguntas custom'
    required: false
    default: 'src/infrastructure/adapters/outbound/data/customGameData.json'
  archivo_default:
    description: 'Ruta del JSON de preguntas por defecto (para comprobar si la existente es una copia)'
    required: false
    default: 'src/infrastructure/adapters/outbound/data/defaultGameData.json'

outputs:
  commit_message:
    description: 'Mensaje de commit propuesto, p. ej. "Pregunta nueva para Topo (A): Amaral"'
  total:
    description: 'Número de preguntas que tiene ahora esa letra para ese jugador'
  sustituida:
    description: '"true" si se ha borrado la copia de la pregunta por defecto'

runs:
  using: node20
  main: index.mjs
